title: Pandino Documentation
description: A modular JavaScript framework inspired by OSGi
baseurl: "/pandino"
url: "blackbelttechnology.github.io"

# Use a GitHub Pages supported theme
theme: minima

# Enable syntax highlighting
highlighter: rouge
markdown: kramdown

# Enable plugins
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# Repository info for SEO
repository: BlackBeltTechnology/pandino
github_username: noherczeg

# Enable syntax highlighting for TypeScript
kramdown:
  syntax_highlighter_opts:
    default_lang: typescript

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
