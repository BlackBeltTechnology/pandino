# GitHub Pages Jekyll configuration
title: "Pandino: OSGi-Style Framework for TypeScript"
description: "A lightweight TypeScript framework that brings modular architecture to your applications"

# Use a GitHub Pages supported theme
theme: minima

# Enable syntax highlighting
highlighter: rouge
markdown: kramdown

# Enable plugins
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# Navigation
header_pages:
  - README.md

# Repository info for SEO
repository: BlackBeltTechnology/pandino
github_username: noherczeg

# Enable syntax highlighting for TypeScript
kramdown:
  syntax_highlighter_opts:
    default_lang: typescript
