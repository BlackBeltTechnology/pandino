name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Explicit version number to release (e.g. 0.9.0)'
        required: true
      branch:
        description: 'Branch to create the release from'
        required: true
        default: 'master'

jobs:
  release:
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_OSS_AUTOMATION_TOKEN }}
      GH_TOKEN: ${{ secrets.OSS_PAT }}

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
        with:
          ref: ${{ inputs.branch }}

      - name: setup git config
        run: |
          git config user.name "blackbelt-oss"
          git config user.email "oss@blackbelt.hu"

      - name: Use Node.js 18.x
        uses: actions/setup-node@v3
        with:
          node-version: 18.x
          registry-url: 'https://registry.npmjs.org'

      - uses: pnpm/action-setup@v2
        name: Install pnpm
        with:
          version: 8
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - uses: actions/cache@v3
        name: Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install

      - name: Set explicit version
        run: |
          VERSION="${{ inputs.version }}"
          echo "Setting version to ${VERSION} across all workspace packages"
          node -e "
            const fs = require('fs');
            const { execSync } = require('child_process');
            const files = execSync('find packages -name package.json -not -path \"*/node_modules/*\"', { encoding: 'utf-8' }).trim().split('\n').filter(Boolean);
            for (const file of files) {
              const pkg = JSON.parse(fs.readFileSync(file, 'utf-8'));
              if (pkg.version) {
                pkg.version = '${VERSION}';
                fs.writeFileSync(file, JSON.stringify(pkg, null, 2) + '\n');
                console.log('  Updated ' + pkg.name + ' -> ${VERSION}');
              }
            }
          "

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm run test

      - name: Publish
        run: npx changeset publish

      - name: Create Git Tag
        run: |
          VERSION="${{ inputs.version }}"
          git tag -a "v${VERSION}" -m "Release v${VERSION}"
          git push origin "v${VERSION}"

      - name: Create GitHub Release
        run: |
          VERSION="${{ inputs.version }}"
          gh release create "v${VERSION}" \
            --target "${{ inputs.branch }}" \
            --title "v${VERSION}" \
            --generate-notes
