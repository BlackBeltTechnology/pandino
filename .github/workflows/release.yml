name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'The explicit version to set (e.g., 9.11.3)'
        required: true
        type: string

jobs:
  release:
    permissions:
      contents: write
    env:
      NODE_AUTH_TOKEN: ${{ secrets.PANDINO_NPM_AUTOMATION_TOKEN }}
      GH_TOKEN: ${{ secrets.OSS_PAT }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: setup git config
        run: |
          git config user.name "blackbelt-oss"
          git config user.email "oss@blackbelt.hu"

      - name: Setup Node.js environment
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 'lts/*'

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Test all packages
        run: pnpm test

      - name: Bump version in all packages
        run: |
          npm version ${{ github.event.inputs.version }} --no-git-tag-version
          pnpm -r exec npm pkg set version=${{ github.event.inputs.version }}

      - name: Get new version from root package.json
        id: get_version
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Re-build all packages with new version
        run: pnpm build

      - name: Setup Node.js for publishing
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 'lts/*'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish packages to NPM
        run: pnpm -r publish --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PANDINO_NPM_AUTOMATION_TOKEN }}

      - name: Push changes to repository
        run: |
          git push origin HEAD:${{ github.ref_name }} --follow-tags

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: v${{ steps.get_version.outputs.VERSION }}
          name: Release v${{ steps.get_version.outputs.VERSION }}
          body: 'New release v${{ steps.get_version.outputs.VERSION }}'
          draft: false
          prerelease: false
