name: release

on:
  push:
    tags:
      - 'v*'
    branches:
      - master
      - develop

jobs:
  release:
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_OSS_AUTOMATION_TOKEN }}
      GH_TOKEN: ${{ secrets.OSS_PAT }}

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: setup git config
        run: |
          git config user.name "blackbelt-oss"
          git config user.email "oss@blackbelt.hu"

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          registry-url: 'https://registry.npmjs.org'

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          version: 10
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - uses: actions/cache@v4
        name: Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install cocogitto
        run: |
          curl -sSL https://github.com/cocogitto/cocogitto/releases/latest/download/cocogitto-$(uname -m)-unknown-linux-gnu.tar.gz | tar -xz
          sudo mv cog /usr/local/bin/
          cog --version

      - name: Check if tag-triggered release
        id: check-tag
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            echo "triggered-by-tag=true" >> $GITHUB_OUTPUT
            TAG=${GITHUB_REF#refs/tags/}
            echo "tag=$TAG" >> $GITHUB_OUTPUT
            # Extract version without 'v' prefix
            VERSION=${TAG#v}
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          else
            echo "triggered-by-tag=false" >> $GITHUB_OUTPUT
          fi

      - name: Bump package versions to tag
        if: steps.check-tag.outputs.triggered-by-tag == 'true'
        run: |
          echo "Updating all package.json files to version: ${{ steps.check-tag.outputs.version }}"

          # Update root package.json
          npm version ${{ steps.check-tag.outputs.version }} --no-git-tag-version

          # Update all package.json files in packages/*
          for package_dir in packages/*/; do
            if [ -f "${package_dir}package.json" ]; then
              echo "Updating version in ${package_dir}package.json"
              cd "$package_dir"
              npm version ${{ steps.check-tag.outputs.version }} --no-git-tag-version
              cd - > /dev/null
            fi
          done

          # Show updated versions for verification
          echo "Updated versions:"
          echo "Root: $(grep '"version"' package.json)"
          for package_dir in packages/*/; do
            if [ -f "${package_dir}package.json" ]; then
              echo "${package_dir}: $(grep '"version"' ${package_dir}package.json)"
            fi
          done

      - name: Build packages
        run: pnpm build

      - name: Run tests
        run: pnpm test

      - name: Generate release notes
        if: steps.check-tag.outputs.triggered-by-tag == 'true'
        id: release-notes
        run: |
          # Get the previous tag to generate changelog between tags
          PREVIOUS_TAG=$(git tag --sort=-version:refname | grep -v "${{ steps.check-tag.outputs.tag }}" | head -n1)
          if [ -z "$PREVIOUS_TAG" ]; then
            # If no previous tag, use first commit
            PREVIOUS_TAG=$(git rev-list --max-parents=0 HEAD)
            echo "No previous tag found, using first commit: $PREVIOUS_TAG"
          else
            echo "Previous tag found: $PREVIOUS_TAG"
          fi

          # Generate changelog entry and update CHANGELOG.md
          cog changelog --from $PREVIOUS_TAG --to ${{ steps.check-tag.outputs.tag }} --template default || echo "No conventional commits found for this release."

          # Extract the release notes for this specific version from CHANGELOG.md
          # Look for the section between the current version and the next version/end
          TEMP_NOTES=$(awk '/^## \[${{ steps.check-tag.outputs.tag }}\]/{flag=1; next} /^## \[/{flag=0} flag' CHANGELOG.md || echo "Release ${{ steps.check-tag.outputs.tag }}")

          # If no content found, provide a fallback
          if [ -z "$TEMP_NOTES" ] || [ "$(echo "$TEMP_NOTES" | xargs)" = "" ]; then
            TEMP_NOTES="Release ${{ steps.check-tag.outputs.tag }}"
          fi

          # Output for GitHub release
          echo "release-notes<<EOF" >> $GITHUB_OUTPUT
          echo "$TEMP_NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Publish to NPM
        if: steps.check-tag.outputs.triggered-by-tag == 'true'
        run: |
          echo "Publishing packages for tag: ${{ steps.check-tag.outputs.tag }}"
          pnpm --filter "@pandino/pandino" publish --access public --no-git-checks
          pnpm --filter "@pandino/react-hooks" publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_OSS_AUTOMATION_TOKEN }}

      - name: Create GitHub Release
        if: steps.check-tag.outputs.triggered-by-tag == 'true'
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.OSS_PAT }}
        with:
          tag_name: ${{ steps.check-tag.outputs.tag }}
          name: Release ${{ steps.check-tag.outputs.tag }}
          body: ${{ steps.release-notes.outputs.release-notes }}
          draft: false
          prerelease: false
