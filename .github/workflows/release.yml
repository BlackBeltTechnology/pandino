name: release

on:
  workflow_dispatch:
    branches:
      - develop
    inputs:
      version:
        description: 'Version number (e.g., 0.9.12, 1.0.0)'
        required: true
        type: string

jobs:
  release:
    # Only run on develop branch
    if: github.ref == 'refs/heads/develop'

    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_OSS_AUTOMATION_TOKEN }}
      GH_TOKEN: ${{ secrets.OSS_PAT }}

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: setup git config
        run: |
          git config user.name "blackbelt-oss"
          git config user.email "oss@blackbelt.hu"

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          registry-url: 'https://registry.npmjs.org'

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          version: 10
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - uses: actions/cache@v4
        name: Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Run tests
        run: pnpm test

      - name: Bump version and create tag
        run: |
          echo "Bumping version to ${{ inputs.version }} and creating git tag"
          # Use pnpm version to update all workspace packages and create git tag
          pnpm version ${{ inputs.version }}

      - name: Generate release notes
        id: release-notes
        run: |
          # Get the previous tag to generate changelog between tags
          PREVIOUS_TAG=$(git tag --sort=-version:refname | grep -v "v${{ inputs.version }}" | head -n1)
          if [ -z "$PREVIOUS_TAG" ]; then
            # If no previous tag, use first commit
            PREVIOUS_TAG=$(git rev-list --max-parents=0 HEAD)
            echo "No previous tag found, using first commit: $PREVIOUS_TAG"
          else
            echo "Previous tag found: $PREVIOUS_TAG"
          fi

          # Generate simple release notes from git log with conventional commits
          echo "## Release v${{ inputs.version }}" > temp_release_notes.md
          echo "" >> temp_release_notes.md

          # Get commits between tags and format them
          git log --pretty=format:"- %s" $PREVIOUS_TAG..v${{ inputs.version }} | grep -E "^- (feat|fix|docs|style|refactor|perf|test|build|ci|chore)" >> temp_release_notes.md || echo "- Miscellaneous improvements and bug fixes" >> temp_release_notes.md

          # Read the generated notes
          RELEASE_NOTES=$(cat temp_release_notes.md)

          # Output for GitHub release
          echo "release-notes<<EOF" >> $GITHUB_OUTPUT
          echo "$RELEASE_NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Publish to NPM
        run: |
          echo "Publishing packages for version: ${{ inputs.version }}"

          # Publish packages using pnpm recursive publish
          # This will handle workspace: dependencies correctly
          pnpm publish -r --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_OSS_AUTOMATION_TOKEN }}

      - name: Push changes and tag
        run: |
          # Push both the commit and the tag to remote
          git push origin develop
          git push origin v${{ inputs.version }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.OSS_PAT }}
        with:
          tag_name: v${{ inputs.version }}
          name: Release v${{ inputs.version }}
          body: ${{ steps.release-notes.outputs.release-notes }}
          draft: false
          prerelease: false
